name: Startup Infrastructure CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Run Next.js Build & Lint
      run: npm run build

    # --- THE NEW CD PIPELINE ---
    - name: Build Docker Image
      # We tag the image with your specific Docker username
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/car-rental-cloud:latest .

    - name: Log in to Docker Hub
      # Securely logs in using the hidden secrets you just created
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push to Registry
      # Uploads the finished container to the internet!
      run: docker push ${{ secrets.DOCKER_USERNAME }}/car-rental-cloud:latest